<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письмо Деду Морозу 🎅</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top, #2b5876 0%, #0f1b31 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  .bg-snow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .bg-snow span {
    position: absolute;
    top: -10px;
    color: white;
    font-size: 1.2em;
    opacity: 0.6;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(360deg); }
  }

  .snowman {
    position: absolute;
    bottom: -20px; right: -20px;
    font-size: 8em;
    opacity: 0.1;
    z-index: 1;
    transform: rotate(-15deg);
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    padding: 45px 40px;
    max-width: 550px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255,255,255,0.5);
    position: relative;
    z-index: 2;
    animation: appear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(50px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    text-align: center;
    color: #1a365d;
    font-size: 2.2em;
    margin-bottom: 5px;
    font-weight: 800;
    text-shadow: 2px 2px 0px #f6e05e;
  }
  .subtitle {
    text-align: center;
    color: #666;
    font-size: 1em;
    margin-bottom: 30px;
    font-weight: 600;
  }

  .field {
    margin-bottom: 22px;
    position: relative;
  }

  label {
    display: block;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 8px;
    font-size: 0.9em;
    padding-left: 5px;
  }

  input, textarea {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e1e8ed;
    border-radius: 15px;
    font-size: 1em;
    font-family: 'Nunito', sans-serif;
    background: #f8fafc;
    transition: all 0.3s ease;
    color: #333;
    font-weight: 600;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #3182ce;
    background: #fff;
    box-shadow: 0 0 0 5px rgba(49, 130, 206, 0.15);
    transform: translateY(-2px);
  }

  textarea {
    resize: vertical;
    min-height: 120px;
    line-height: 1.6;
  }

  .error {
    color: #e74c3c;
    font-size: 0.8em;
    font-weight: 700;
    margin-top: 6px;
    display: none;
    padding-left: 5px;
    animation: shake 0.4s;
  }
  input.invalid, textarea.invalid {
    border-color: #e74c3c;
    background: #fdf2f2;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #2b6cb0, #1e3a8a);
    color: white;
    font-size: 1.2em;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
    margin-top: 10px;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }
  .btn:hover::after { left: 100%; }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(30, 58, 138, 0.6);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.7; cursor: default; transform: none; }

  .success {
    display: none;
    text-align: center;
    padding: 30px 10px;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }
  .success .snow { 
    font-size: 5em; 
    margin-bottom: 20px; 
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .success h2 { 
    color: #2b6cb0; 
    margin-bottom: 15px; 
    font-size: 1.8em;
    font-weight: 800;
  }
  .success p { 
    color: #555; 
    line-height: 1.6; 
    margin-bottom: 30px;
    font-size: 1.05em;
  }
  .success .again {
    background: white;
    border: 2px solid #2b6cb0;
    color: #2b6cb0;
    padding: 12px 30px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 800;
    font-size: 1em;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  .success .again:hover { 
    background: #2b6cb0; 
    color: white; 
    transform: translateY(-2px);
  }

  .sending-anim {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4em;
    animation: flyAway 1.5s ease-in forwards;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes flyAway {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50% { transform: translate(20%, -50%) scale(1.2) rotate(15deg); }
    100% { transform: translate(200%, -200%) scale(0.5) rotate(30deg); opacity: 0; }
  }

  /* Стили для выпадающего списка подсказок DaData */
  .suggestions-container {
    position: relative;
  }
  .suggestions-container .suggestions-wrapper {
    position: absolute;
    z-index: 100;
    width: 100%;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    margin-top: 5px;
    overflow: hidden;
  }
  .suggestions-container .suggestions-suggestions {
    padding: 0;
    margin: 0;
    list-style: none;
  }
  .suggestions-container .suggestions-suggestion {
    padding: 12px 18px;
    cursor: pointer;
    font-weight: 600;
    color: #333;
    border-bottom: 1px solid #f0f0f0;
  }
  .suggestions-container .suggestions-suggestion:hover,
  .suggestions-container .suggestions-suggestion.selected {
    background: #ebf8ff;
    color: #2b6cb0;
  }
  .suggestions-container .suggestions-hint {
    display: none;
  }

  @media (max-width: 480px) {
    .container { padding: 30px 20px; }
    h1 { font-size: 1.8em; }
  }
</style>
</head>
<body>

<div class="bg-snow" id="bgSnow"></div>
<div class="snowman">⛄</div>

<div class="container">
  <form id="letterForm" novalidate>
    <h1>🎅 Письмо Деду Морозу</h1>
    <p class="subtitle">Напиши самое сокровенное желание!</p>

    <div class="field">
      <label for="name">Как тебя зовут? *</label>
      <input type="text" id="name" placeholder="Например: Иванова Машенька" maxlength="50">
      <div class="error" id="nameError">Пожалуйста, укажи имя</div>
    </div>

    <!-- Умное поле адреса с поиском -->
    <div class="field suggestions-container">
      <label for="address">Куда приносить подарок? *</label>
      <input type="text" id="address" placeholder="Начни печатать город или улицу..." autocomplete="off">
      <div class="error" id="addressError">Пожалуйста, выбери адрес из списка</div>
    </div>

    <div class="field">
      <label for="message">Твоё письмо *</label>
      <textarea id="message" placeholder="Здравствуй, Дедушка Мороз! Я весь год вёл(а) себя хорошо и очень хочу..." maxlength="1000"></textarea>
      <div class="error" id="messageError">Напиши хотя бы пару слов (мин. 10 символов)</div>
    </div>

    <button type="submit" class="btn" id="sendBtn">Отправить письмо 📨</button>
  </form>

  <div class="success" id="successScreen">
    <div class="snow">❄️🎅❄️</div>
    <h2>Письмо отправлено!</h2>
    <p>Твоё письмо уже летит в Великий Устюг.<br>Дед Мороз обязательно прочитает его и подготовит самый лучший подарок!</p>
    <button class="again" id="againBtn">Написать ещё одно</button>
  </div>
</div>

<!-- Подключаем скрипт и стили DaData -->
<link href="https://cdn.jsdelivr.net/npm/@dadata/suggestions@25.4.1/dist/suggestions.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@dadata/suggestions@25.4.1/dist/suggestions.min.js"></script>

<script>
  // ⚠️ ВАШ URL ВЕБ-ПРИЛОЖЕНИЯ GOOGLE APPS SCRIPT
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwOJTgRqbBWVggFUr54Gt_tavQO3QS7t50IJGPcwffw7J4aVO71gY3dIB49g82i8Zb0Lg/exec';

  // ⚠️ ВАШ API-КЛЮЧ DADATA (вставлен)
  const DADATA_TOKEN = '1c384cb45fb5b0bbf9235975b95a7d1673e00a91';

  // Снежинки
  const bgSnow = document.getElementById('bgSnow');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.textContent = ['❄', '❅', '❆', '•'][Math.floor(Math.random() * 4)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (Math.random() * 1 + 0.5) + 'em';
    s.style.animationDuration = (Math.random() * 10 + 5) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    bgSnow.appendChild(s);
  }

  // Инициализация подсказок DaData
  const addressInput = document.getElementById('address');
  Dadata.createSuggestions(addressInput, {
    token: DADATA_TOKEN,
    type: "address",
    // Ограничиваем поиск только адресами (город, улица, дом)
    // Можно добавить параметры для более точной настройки
  });

  const form = document.getElementById('letterForm');
  const nameEl = document.getElementById('name');
  const messageEl = document.getElementById('message');
  const successScreen = document.getElementById('successScreen');
  const sendBtn = document.getElementById('sendBtn');
  const container = document.querySelector('.container');

  function showError(el, errorEl, show) {
    el.classList.toggle('invalid', show);
    errorEl.style.display = show ? 'block' : 'none';
  }

  nameEl.addEventListener('input', () => showError(nameEl, document.getElementById('nameError'), false));
  addressInput.addEventListener('input', () => showError(addressInput, document.getElementById('addressError'), false));
  messageEl.addEventListener('input', () => showError(messageEl, document.getElementById('messageError'), false));

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const nameOk = nameEl.value.trim().length >= 2;
    const addressOk = addressInput.value.trim().length >= 5;
    const messageOk = messageEl.value.trim().length >= 10;

    showError(nameEl, document.getElementById('nameError'), !nameOk);
    showError(addressInput, document.getElementById('addressError'), !addressOk);
    showError(messageEl, document.getElementById('messageError'), !messageOk);

    if (!nameOk || !addressOk || !messageOk) {
      const firstInvalid = [nameEl, addressInput, messageEl].find(el => el.classList.contains('invalid'));
      if (firstInvalid) firstInvalid.focus();
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = 'Отправляем... ⏳';

    const anim = document.createElement('div');
    anim.className = 'sending-anim';
    anim.textContent = '✉️';
    container.appendChild(anim);

    const letter = {
      name: nameEl.value.trim(),
      address: addressInput.value.trim(), // Отправляем выбранный из подсказок адрес
      message: messageEl.value.trim()
    };

    fetch(scriptURL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(letter)
    })
    .then(response => response.json())
    .then(data => {
      if (data.result === 'success') {
        setTimeout(() => {
          anim.remove();
          form.style.display = 'none';
          successScreen.style.display = 'block';
          
          for(let i=0; i<20; i++) {
            const confetti = document.createElement('div');
            confetti.textContent = '❄️';
            confetti.style.position = 'absolute';
            confetti.style.left = '50%';
            confetti.style.top = '50%';
            confetti.style.fontSize = (Math.random() * 1.5 + 1) + 'em';
            confetti.style.transition = 'all 1s ease-out';
            container.appendChild(confetti);
            
            setTimeout(() => {
              confetti.style.left = (Math.random() * 100) + '%';
              confetti.style.top = (Math.random() * 100) + '%';
              confetti.style.opacity = '0';
            }, 50);
            
            setTimeout(() => confetti.remove(), 1500);
          }
        }, 1200);
      } else {
        anim.remove();
        alert('Ошибка: ' + (data.message || 'Не удалось сохранить письмо'));
        sendBtn.disabled = false;
        sendBtn.textContent = 'Отправить письмо 📨';
      }
    })
    .catch(error => {
      anim.remove();
      console.error('Ошибка:', error);
      alert('Не удалось отправить письмо. Проверьте интернет-соединение.');
      sendBtn.disabled = false;
      sendBtn.textContent = 'Отправить письмо 📨';
    });
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    form.reset();
    sendBtn.disabled = false;
    sendBtn.textContent = 'Отправить письмо 📨';
    successScreen.style.display = 'none';
    form.style.display = 'block';
    nameEl.focus();
  });
</script>

</body>
</html>
